<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mini-Test TKI — Morgan Services</title>
<style>
:root{--p:#5B2C6F;--s:#8E44AD;--a:#D2B4DE;--bg:#FAFAFA;--tx:#1A1A1A;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter','Helvetica Neue',sans-serif;background:#E8E0F0;color:var(--tx);min-height:100vh;display:flex;justify-content:center;padding:20px;}
.app{width:100%;max-width:660px;}
.hdr{background:var(--p);color:#fff;border-radius:12px;padding:16px 20px;margin-bottom:20px;}
.hdr .mod{font-size:9px;opacity:.7;text-transform:uppercase;letter-spacing:1.5px;}
.hdr h1{font-size:19px;font-weight:800;margin-top:4px;line-height:1.2;}
.hdr .sub{font-size:11px;opacity:.85;margin-top:4px;}
.progress-info{display:flex;justify-content:space-between;font-size:12px;color:var(--p);font-weight:600;margin-bottom:5px;}
.bar-bg{height:7px;background:var(--a);border-radius:4px;margin-bottom:18px;}
.bar-fill{height:100%;background:var(--s);border-radius:4px;transition:width .3s;}
.card{background:#fff;border-radius:12px;padding:22px;box-shadow:0 2px 14px rgba(91,44,111,.1);margin-bottom:16px;}
.q-tag{font-size:11px;color:var(--s);font-weight:700;margin-bottom:7px;}
.q-txt{font-size:15px;font-weight:600;line-height:1.55;margin-bottom:18px;}
.opt{padding:11px 15px;border-radius:8px;border:2px solid #EAE0F2;background:#fff;cursor:pointer;font-size:13px;line-height:1.5;margin-bottom:9px;transition:all .15s;color:var(--tx);width:100%;text-align:left;}
.opt:hover{border-color:var(--a);background:#FAF5FF;}
.opt.sel{border-color:var(--p);background:#F3E5F5;}
.btn{width:100%;padding:14px;background:var(--p);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:background .2s;font-family:inherit;}
.btn:disabled{background:#C9B8D8;cursor:not-allowed;}
.btn.sec{background:#fff;color:var(--p);border:2px solid var(--p);}
.btn-row{display:flex;gap:12px;margin-bottom:8px;}

/* RESULTS */
.res-section{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 14px rgba(91,44,111,.1);margin-bottom:16px;}
.res-title{font-weight:700;color:var(--p);font-size:14px;margin-bottom:14px;}
.score-bar{margin-bottom:10px;}
.score-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px;}
.score-name{font-weight:600;}
.score-val{color:var(--s);font-weight:700;}
.bar2-bg{height:9px;background:#F0E8F8;border-radius:5px;}
.bar2-fill{height:100%;border-radius:5px;transition:width .6s;}
.ranking{margin-top:14px;font-size:12px;color:#555;line-height:2.2;}
.interp-box{background:#F3E5F5;border:2px solid var(--p);border-radius:12px;padding:18px;margin-bottom:16px;}
.interp-title{font-weight:800;color:var(--p);font-size:15px;margin-bottom:12px;}
.interp-row{margin-bottom:9px;font-size:13.5px;line-height:1.65;}
.falc-box{background:#FFFBEA;border:2px solid #F0C040;border-radius:12px;padding:16px;margin-bottom:16px;}
.falc-title{font-weight:700;margin-bottom:9px;font-size:14px;}
.falc-box p{font-size:13px;line-height:2.1;}
.footer{border-top:1px solid var(--a);margin-top:8px;padding-top:12px;text-align:center;font-size:9px;color:#999;}

/* RADAR SVG */
svg.radar{display:block;margin:0 auto;}

@media print{
  body{background:#fff;padding:0;}
  .app{max-width:100%;}
  .btn,.btn-row{display:none!important;}
  .hdr,.interp-box{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
@media(max-width:500px){.hdr h1{font-size:16px;}.q-txt{font-size:14px;}.opt{font-size:12px;}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const P="#5B2C6F",S="#8E44AD",A="#D2B4DE";

const STYLES=["S'IMPOSER","CÉDER","ÉVITER","COMPROMIS","COLLABORER"];
const ICONS=["🦁","🐻","🐢","🤝","🧠"];
const COLORS=["#8B1A8B","#7D3C98","#9B59B6","#6C3483","#5B2C6F"];

const QS=[
  {tag:"Q1 — Client EU furieux, intérimaire absent",
   txt:"Un client (EU) appelle furieux : son intérimaire ne s'est pas présenté ce matin. Tu fais quoi ?",
   opts:["Tu rappelles l'intérimaire et tu lui passes un savon : \"C'est ta dernière mission si ça se reproduit.\"","Tu présentes tes excuses au client et tu absorbes la critique sans contester : \"Je comprends, on va trouver mieux.\"","Tu temporises : \"Je vous rappelle dans 1h\", puis tu repousses au lendemain.","Tu proposes un autre intérimaire en remplacement immédiat, gratuit pour la première heure perdue.","Tu écoutes le client, tu appelles l'intérimaire, tu identifies si c'est ponctuel ou structurel, et tu organises un point à 3."]},
  {tag:"Q2 — Conflit interne : deux consultants sur un même client",
   txt:"Deux consultants de ton agence se disputent un nouveau client industriel qui rentre dans leurs deux portefeuilles.",
   opts:["Tu tranches : \"C'est X qui le prend, j'ai décidé.\"","Tu laisses celui qui crie le plus fort.","Tu attends que ça se tasse de soi-même.","Co-pilotage 3 mois, puis arbitrage à mi-parcours.","Vous prenez 1h ensemble pour redéfinir la règle d'attribution une bonne fois pour toutes."]},
  {tag:"Q3 — Intérimaire vs chef d'équipe EU",
   txt:"Un intérimaire vient se plaindre du comportement d'un chef d'équipe chez le client. Tu n'as qu'une seule version des faits.",
   opts:["Tu rappelles l'EU immédiatement et tu exiges une explication du chef d'équipe.","Tu rassures l'intérimaire sans prendre de mesure concrète : \"Je note, on verra.\"","Tu lui dis de tenir encore quelques jours — la mission se termine bientôt.","Tu contactes l'EU pour signaler la situation, sans citer le nom de l'intérimaire.","Tu prends RDV avec l'EU et l'intérimaire séparément avant toute décision."]},
  {tag:"Q4 — Collègue qui ne respecte pas les process",
   txt:"Un collègue consultant ne respecte pas les process de suivi terrain. Tu hérites régulièrement de ses dossiers mal tenus.",
   opts:["Tu le confrontes en réunion d'équipe : \"Ça suffit, c'est pas professionnel.\"","Tu rattrapes le travail sans rien dire pour éviter la tension.","Tu en parles à ton manager dans ta tête... mais tu ne fais rien.","Tu lui proposes un deal : \"Je ne soulève pas le sujet en réunion si tu soignes les 3 prochains dossiers.\"","Tu prends un café avec lui, tu montres concrètement l'impact sur toi, et vous cherchez une solution ensemble."]},
  {tag:"Q5 — EU veut mettre fin à une mission sans motif clair",
   txt:"Une EU veut mettre fin à la mission d'un intérimaire sans motif clair. Tu sens que c'est une question de feeling, pas de compétence.",
   opts:["Tu refuses catégoriquement : \"Sans motif valable, je ne mets pas fin à la mission.\"","Tu acceptes sans insister pour ne pas perdre le client.","Tu dis que tu vas \"regarder ça\" et tu n'agis pas dans les 48h.","Tu proposes un autre profil en échange de la continuation jusqu'à la fin de semaine.","Tu demandes un RDV avec le responsable EU pour comprendre le vrai problème avant toute décision."]},
  {tag:"Q6 — Ton N+1 te demande de valider une mission borderline",
   txt:"Ton N+1 te demande de valider une mission pour un intérimaire qui ne correspond pas au poste. \"C'est un service à rendre à un client important.\"",
   opts:["Tu refuses fermement : \"Si ça tourne mal, c'est moi qui porte la responsabilité. Non.\"","Tu valides sans protester pour ne pas te mettre en porte-à-faux.","Tu joues la montre en demandant des délais de vérification indéfinis.","Tu valides partiellement : \"Je place l'intérimaire 3 jours, on réévalue.\"","Tu proposes un entretien à 3 (toi, ton N+1, le client) pour trouver une solution qui protège tout le monde."]},
  {tag:"Q7 — Clash en réunion commerciale",
   txt:"En réunion d'équipe, deux consultants s'accrochent sur la stratégie de prospection. Le ton monte. Tu animes la réunion.",
   opts:["Tu coupes court : \"On arrête là. Je décide de la stratégie, on passe à la suite.\"","Tu laisses les deux s'exprimer jusqu'au bout, même si ça déborde.","Tu changes de sujet discrètement pour calmer l'atmosphère.","Tu demandes à chacun de retenir 2 points de sa stratégie, et tu construis un mix des deux.","Tu stoppes la réunion, tu poses les 2 visions au tableau, et tu demandes au groupe d'évaluer les avantages de chacune."]},
  {tag:"Q8 — Intérimaire qui refuse une mission de remplacement",
   txt:"Un intérimaire fidèle refuse une mission de remplacement de 2 jours. Il dit que c'est \"pas dans son domaine\". Tu as besoin de lui.",
   opts:["Tu lui rappelles que refuser une mission peut mettre fin à votre relation : \"C'est toi qui choisis.\"","Tu cherches quelqu'un d'autre sans rien dire pour ne pas l'énerver.","Tu lui envoies un message et tu attends sa réponse sans relancer.","Tu lui proposes une contrepartie : heures mieux rémunérées ou priorité sur la prochaine belle mission.","Tu prends 10 minutes pour comprendre ses réserves réelles, et vous explorez ensemble si la mission peut être adaptée."]},
  {tag:"Q9 — Deux intérimaires refusent de travailler ensemble",
   txt:"Deux intérimaires d'une même équipe chez un client refusent de travailler ensemble. Le client te demande de régler ça.",
   opts:["Tu leur annonces clairement : \"Soit vous travaillez ensemble, soit je mets fin aux deux missions.\"","Tu rassures le client et tu espères que la situation s'auto-régule.","Tu proposes d'attendre la fin de la semaine pour \"observer\".","Tu réorganises les plannings pour minimiser leurs points de contact jusqu'à la fin de mission.","Tu les rencontres séparément pour comprendre la source, puis tu proposes une mise au point à 3."]},
  {tag:"Q10 — Tension systémique dans l'agence",
   txt:"La pression des objectifs crée une ambiance de tension permanente dans l'agence. Les gens s'irritent pour rien. Tu es directeur d'agence.",
   opts:["Tu recadres l'équipe en réunion : \"Les résultats d'abord, les états d'âme après.\"","Tu laisses passer : \"C'est une période difficile, ça va revenir.\"","Tu évites d'aborder le sujet ouvertement pour ne pas ajouter de pression.","Tu revois les objectifs à la baisse temporairement et tu annonces un point d'étape dans 2 semaines.","Tu organises un atelier d'équipe pour identifier ensemble les sources de tension et les leviers d'action."]}
];

const INTERP=[
  {titre:"🦁 Tu es un Manager Directif",apport:"Tu tranches vite, tu protèges l'équipe des décisions floues, tu sécurises les situations d'urgence.",risque:"Tu peux écraser les contributions et générer des rancœurs durables. L'équipe finit par attendre ta validation pour tout.",dev:"🧠 COLLABORER : prends le temps d'impliquer, même quand c'est inconfortable."},
  {titre:"🐻 Tu es un Manager Apaisant",apport:"Tu préserves les relations, tu désamorces les tensions immédiates, tu crées un climat de confiance.",risque:"Tu accumules une frustration silencieuse. Les problèmes reviennent en boucle parce qu'ils ne sont jamais vraiment traités.",dev:"🦁 S'IMPOSER sur les sujets importants : céder n'est pas neutre, c'est une décision."},
  {titre:"🐢 Tu es un Manager Attentiste",apport:"Tu laisses du temps au temps. Parfois, les conflits se dissolvent seuls — et tu as évité une escalade inutile.",risque:"Les tensions s'enracinent et deviennent systémiques. L'évitement répété est perçu comme une absence de leadership.",dev:"🤝 COMPROMIS : commence par des solutions partielles, c'est mieux que l'inaction."},
  {titre:"🤝 Tu es un Manager Négociateur",apport:"Tu trouves rapidement des solutions acceptables, tu maintiens le mouvement, tu débloques les situations.",risque:"Chacun perd un peu à chaque compromis. Les causes profondes ne sont jamais traitées — et les conflits reviennent.",dev:"🧠 COLLABORER sur les sujets récurrents : investis du temps pour régler définitivement."},
  {titre:"🧠 Tu es un Manager Intégrateur",apport:"Tu traites les causes, tu renforces la relation, tu construis des solutions durables et partagées.",risque:"Tu mobilises du temps que tu n'as pas toujours. Dans l'urgence, la collaboration peut paralyser.",dev:"🦁 S'IMPOSER pour les urgences : savoir trancher vite est aussi une compétence managériale."}
];

// --- STATE ---
let cur=0, answers={}, sel=null;

function render(){
  document.getElementById("app").innerHTML = cur<QS.length ? renderQ() : renderResults();
}

function renderQ(){
  const q=QS[cur], pct=Math.round(cur/QS.length*100);
  return `
  <div class="hdr">
    <div class="mod">Morgan Services — Formation Managériale</div>
    <h1>⚔️ MINI-TEST TKI — Mon style face aux conflits</h1>
    <div class="sub">Module "Le Manager face aux conflits" — 23 MindSet</div>
  </div>
  <div class="progress-info"><span>Question ${cur+1} / ${QS.length}</span><span>${pct}% complété</span></div>
  <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
  <div class="card">
    <div class="q-tag">${q.tag}</div>
    <div class="q-txt">${q.txt}</div>
    ${q.opts.map((o,i)=>`<button class="opt${sel===i?' sel':''}" onclick="choose(${i})">${o}</button>`).join('')}
  </div>
  <button class="btn" ${sel===null?'disabled':''} onclick="next()">
    ${cur<QS.length-1?'Question suivante →':'Voir mes résultats 🎯'}
  </button>
  <div class="footer">LE MANAGER FACE AUX CONFLITS — Module Formasuite ADF_2026420<br/>© 2026 — 23 MindSet / ATBA Fares — Tous droits réservés</div>`;
}

function renderResults(){
  const scores=STYLES.map((_,i)=>Object.values(answers).filter(v=>v===i).length);
  const sorted=[...scores.map((s,i)=>({s,i}))].sort((a,b)=>b.s-a.s);
  const domI=sorted[0].i;
  const ip=INTERP[domI];
  const radar=buildRadar(scores);

  const bars=sorted.map(({s,i})=>`
    <div class="score-bar">
      <div class="score-row"><span class="score-name">${ICONS[i]} ${STYLES[i]}</span><span class="score-val">${s}/10</span></div>
      <div class="bar2-bg"><div class="bar2-fill" style="width:${s*10}%;background:${i===domI?P:A}"></div></div>
    </div>`).join('');

  return `
  <div class="hdr">
    <div class="mod">Tes résultats — Morgan Services</div>
    <h1>🎯 Profil TKI — ${ip.titre}</h1>
    <div class="sub">Module "Le Manager face aux conflits" — 23 MindSet</div>
  </div>
  <div class="res-section">
    <div class="res-title">📊 Ton graphique de styles</div>
    ${radar}
  </div>
  <div class="res-section">
    <div class="res-title">📈 Scores détaillés</div>
    ${bars}
    <div class="ranking">
      🥇 <strong>Dominant :</strong> ${ICONS[sorted[0].i]} ${STYLES[sorted[0].i]} &nbsp;|&nbsp;
      🥈 <strong>Secondaire :</strong> ${ICONS[sorted[1].i]} ${STYLES[sorted[1].i]} &nbsp;|&nbsp;
      ⬇️ <strong>Moins utilisé :</strong> ${ICONS[sorted[4].i]} ${STYLES[sorted[4].i]}
    </div>
  </div>
  <div class="interp-box">
    <div class="interp-title">${ip.titre}</div>
    <div class="interp-row">✅ <strong>Ce que tu apportes :</strong> ${ip.apport}</div>
    <div class="interp-row">⚠️ <strong>Le risque :</strong> ${ip.risque}</div>
    <div class="interp-row">👉 <strong>À développer en priorité :</strong> ${ip.dev}</div>
  </div>
  <div class="falc-box">
    <div class="falc-title">💬 EN MOTS SIMPLES</div>
    <p>👉 Tu as un style principal pour gérer les conflits.</p>
    <p>✅ Ce style a des forces. Il fonctionne dans certaines situations.</p>
    <p>⚠️ Utilisé tout le temps, il peut poser problème.</p>
    <p>👉 L'objectif : choisir le bon style selon la situation.</p>
  </div>
  <div class="btn-row">
    <button class="btn" onclick="window.print()">🖨️ Imprimer mes résultats</button>
    <button class="btn sec" onclick="reset()">🔄 Refaire le test</button>
  </div>
  <div class="footer">LE MANAGER FACE AUX CONFLITS — Module Formasuite ADF_2026420<br/>© 2026 — 23 MindSet / ATBA Fares — Tous droits réservés</div>`;
}

function buildRadar(scores){
  const W=280,H=260,cx=W/2,cy=H/2,R=95;
  const n=5, step=2*Math.PI/n;
  const pts=(r)=>Array.from({length:n},(_,i)=>{
    const a=i*step-Math.PI/2;
    return[cx+r*Math.cos(a),cy+r*Math.sin(a)];
  });

  // grid rings
  const rings=[2,4,6,8,10].map(v=>{
    const r=R*v/10;
    const p=pts(r).map(([x,y])=>x+","+y).join(" ");
    return `<polygon points="${p}" fill="none" stroke="${A}" stroke-width="1"/>`;
  }).join('');

  // axes + labels
  const axes=Array.from({length:n},(_,i)=>{
    const [x,y]=pts(R)[i];
    const [lx,ly]=pts(R+20)[i];
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${A}" stroke-width="1"/>
    <text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="700" fill="${P}">${ICONS[i]} ${STYLES[i]}</text>`;
  }).join('');

  // data polygon
  const dp=scores.map((s,i)=>{
    const r=R*s/10;
    const [x,y]=pts(r)[i];
    return x+","+y;
  }).join(" ");

  // dots
  const dots=scores.map((s,i)=>{
    const [x,y]=pts(R*s/10)[i];
    return `<circle cx="${x}" cy="${y}" r="4" fill="${P}"/>`;
  }).join('');

  return `<svg class="radar" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    ${rings}${axes}
    <polygon points="${dp}" fill="${S}" fill-opacity="0.35" stroke="${P}" stroke-width="2"/>
    ${dots}
  </svg>`;
}

function choose(i){ sel=i; render(); }
function next(){
  if(sel===null)return;
  answers[cur]=sel; sel=null;
  cur++; render();
}
function reset(){ cur=0; answers={}; sel=null; render(); }

render();
</script>
</body>
</html>
